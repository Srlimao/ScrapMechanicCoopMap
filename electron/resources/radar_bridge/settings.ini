[Telemetry]
; Toggle the live interactive debug console window
EnableConsole = true

; Polling rate in milliseconds for entity scanning (e.g. 500 = 2Hz, 100 = 10Hz)
UpdateIntervalMs = 500

; Log verbosity: 0 = Silent, 1 = Normal, 2 = Verbose
LogLevel = 1

; Enable Shared Memory IPC for save_map_viewer
EnableSharedMemory = true
SharedMemoryName = SM_TacticalRadar_Data
